# ====================================================================
# CONFIGURACIÓN DE CORREO SMTP EN SPRING BOOT (MICROSOFT OUTLOOK / OFFICE 365)
# Universidad Tecmilenio - Control de Espacios
# ====================================================================

# Puerto del servidor
server.port=8080

# Servidor SMTP de Microsoft Office 365 / Outlook
spring.mail.host=smtp.office365.com
spring.mail.port=587

# Credenciales de envío del sistema (Modificar con la cuenta asignada)
spring.mail.username=notificaciones.espacios@tecmilenio.mx
spring.mail.password=TU_PASSWORD_O_APP_PASSWORD_AQUI

# Propiedades avanzadas de seguridad y conexión TLS
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.protocols=TLSv1.2
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Codificación predeterminada
spring.mail.default-encoding=UTF-8

# Tamaño máximo de subida de archivos (layouts/croquis)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
